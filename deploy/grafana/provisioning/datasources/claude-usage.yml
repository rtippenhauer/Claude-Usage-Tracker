# Grafana reads tracker.db directly. Mount the tracker's data folder into Grafana:
#   /mnt/user/appdata/claude-usage-tracker/data  ->  /tracker  (rw)
# The mount must be read-write: the DB is in WAL mode and even a read-only reader has to create
# tracker.db-shm (a ro mount fails with "unable to open database file (14)").
# mode=ro keeps Grafana from writing data, and stops SQLite creating an empty tracker.db if the path is wrong.
apiVersion: 1
datasources:
  - name: Claude Usage
    uid: claude-usage-sqlite
    type: frser-sqlite-datasource
    access: proxy
    editable: false
    jsonData:
      path: /tracker/tracker.db
      pathPrefix: "file:"
      pathOptions: "?mode=ro"
